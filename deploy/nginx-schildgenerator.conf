# nginx-Konfiguration für den Schildgenerator.
# "schilder.example.de" durch die eigene (Sub-)Domain ersetzen.
# HTTPS richtet certbot danach automatisch in dieser Datei ein.

server {
    listen 80;
    listen [::]:80;
    server_name schilder.example.de;

    # Passwortschutz (Datei wird in der Anleitung mit htpasswd angelegt)
    auth_basic           "Schildgenerator";
    auth_basic_user_file /etc/nginx/schildgenerator.htpasswd;

    # PDF-Aufträge und hochgeladene Logos können groß sein
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Abruf von expert.de und PDF-Erstellung können etwas dauern
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden · Schildgenerator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f47a25'/%3E%3Cpath d='M9 8h10l5 5v11H9z' fill='%23fff'/%3E%3C/svg%3E">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('schildgenerator.theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    .login { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 26px 24px; box-shadow: 0 12px 40px rgba(0, 0, 0, .08); }
    .login .brand { margin-bottom: 22px; }
    .login h1 { font-size: 18px; margin: 0 0 4px; }
    .login p.lead { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .login label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
    .login input { width: 100%; box-sizing: border-box; height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--input); color: var(--text); font: inherit; font-size: 15px; }
    .login input:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(244, 122, 37, .18); }
    .login .btn { width: 100%; height: 42px; margin-top: 20px; font-size: 15px; }
    .login .err { display: none; margin-top: 14px; padding: 9px 12px; border-radius: 9px; background: #fdecec; color: #b42318; font-size: 13px; }
    [data-theme="dark"] .login .err { background: rgba(240, 68, 56, .15); color: #ff9b93; }
    .login .err.show { display: block; }
    .login .hint { margin-top: 14px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <form class="login" id="form" autocomplete="on">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 12.6V4a1 1 0 0 1 1-1h8.6a1 1 0 0 1 .7.3l7.4 7.4a1 1 0 0 1 0 1.4l-8.6 8.6a1 1 0 0 1-1.4 0L3.3 13.3a1 1 0 0 1-.3-.7z"/><circle cx="7.5" cy="7.5" r="1.6"/></svg>
      </span>
      <div>
        <div class="brand-name">Schildgenerator</div>
        <div class="brand-sub">Preisschilder für expert Asbach</div>
      </div>
    </div>
    <h1 id="title">Anmelden</h1>
    <p class="lead" id="lead">Bitte mit Benutzername und Passwort anmelden.</p>
    <label for="name">Benutzername</label>
    <input id="name" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="pw">Passwort</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <div id="pw2wrap" hidden>
      <label for="pw2">Passwort wiederholen</label>
      <input id="pw2" type="password" autocomplete="new-password">
    </div>
    <div id="codewrap" hidden>
      <label for="code">Einrichtungscode</label>
      <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="steht im Server-Protokoll">
    </div>
    <button class="btn btn-primary" id="submit" type="submit">Anmelden</button>
    <div class="err" id="err" role="alert"></div>
    <div class="hint" id="hint"></div>
  </form>
  <script>
    (function () {
      var setup = false;
      var $ = function (id) { return document.getElementById(id); };
      function showErr(msg) { $('err').textContent = msg; $('err').classList.add('show'); }
      function goNext() {
        var n = new URLSearchParams(location.search).get('next') || '/';
        // nur Ziele auf dieser Seite (keine Umleitung auf fremde Seiten, auch nicht über "//" oder "/\\")
        var ok = /^\/[^\/\\]/.test(n) || n === '/';
        try { ok = ok && new URL(n, location.origin).origin === location.origin; } catch (e) { ok = false; }
        location.replace(ok ? n : '/');
      }
      fetch('/api/auth-state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
        if (s.user) return goNext();
        if (s.broken) {
          $('lead').textContent = 'Die Benutzerdatei auf dem Server ist beschädigt. Anmelden ist gesperrt, bis sie repariert ist (siehe README).';
          $('submit').disabled = true;
        }
        if (s.setup) {
          setup = true;
          $('title').textContent = 'Erstes Konto anlegen';
          $('lead').textContent = 'Es gibt noch kein Konto. Lege jetzt den Administrator an – damit kannst du später weitere Benutzer hinzufügen.';
          $('pw2wrap').hidden = false;
          $('pw').setAttribute('autocomplete', 'new-password');
          $('submit').textContent = 'Konto anlegen';
          $('hint').textContent = 'Passwort: mindestens 8 Zeichen.';
          if (s.needCode) {
            $('codewrap').hidden = false;
            $('hint').textContent = 'Passwort: mindestens 8 Zeichen. Den Einrichtungscode zeigt der Server beim Start an: docker compose logs schildgenerator';
          }
        }
        $('name').focus();
      });
      $('form').addEventListener('submit', function (e) {
        e.preventDefault();
        $('err').classList.remove('show');
        if (setup && $('pw').value !== $('pw2').value) return showErr('Die beiden Passwörter sind nicht gleich.');
        $('submit').disabled = true;
        fetch(setup ? '/api/setup' : '/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: $('name').value, password: $('pw').value, code: $('code').value }),
        }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            if (res.ok) return goNext();
            showErr(res.j.error || 'Anmeldung fehlgeschlagen.');
            $('pw').value = ''; $('pw').focus();
          })
          .catch(function () { showErr('Server nicht erreichbar.'); })
          .then(function () { $('submit').disabled = false; });
      });
    })();
  </script>
</body>
</html>
